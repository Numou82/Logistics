<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Maintenance Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">

  <div class="max-w-4xl mx-auto space-y-6">
    <h1 class="text-3xl font-bold text-gray-800">Pending Complaints</h1>
    <div id="complaintList" class="space-y-4">Loading complaints...</div>
  </div>

  <script>
    // REPLACE THIS WITH YOUR ACTUAL SHEETDB API URL
    const SHEETDB_URL = 'https://sheetdb.io/api/v1/YOUR_SHEETDB_ID';

    async function loadComplaints() {
      const response = await fetch(SHEETDB_URL);
      const data = await response.json();
      
      const container = document.getElementById('complaintList');
      container.innerHTML = '';

      // Filter to show only PENDING items
      const pendingItems = data.filter(item => item.status === 'PENDING');

      if (pendingItems.length === 0) {
        container.innerHTML = '<p class="text-gray-500">No pending complaints!</p>';
        return;
      }

      pendingItems.forEach(item => {
        container.innerHTML += `
          <div class="bg-white p-4 rounded shadow border flex justify-between items-center">
            <div>
              <span class="bg-yellow-200 text-yellow-800 text-xs px-2 py-1 rounded font-bold">${item.id}</span>
              <h3 class="font-bold text-lg mt-1">${item.location_name}</h3>
              <p class="text-sm text-gray-600"><strong>Client:</strong> ${item.client_name}</p>
              <p class="text-sm text-gray-800"><strong>Issue:</strong> ${item.issue}</p>
            </div>
            
            <div class="space-y-2">
              <input type="url" id="link-${item.id}" placeholder="Paste Google Drive/Image Link" class="border p-1 text-sm rounded w-64 block">
              <button onclick="markAsDone('${item.id}')" class="bg-green-600 text-white px-3 py-1 rounded text-sm w-full font-semibold">
                Mark as Done
              </button>
            </div>
          </div>
        `;
      });
    }

    async function markAsDone(id) {
      const imageLink = document.getElementById(`link-${id}`).value;

      if (!imageLink) {
        alert('Please paste an image link before marking as done.');
        return;
      }

      // Update the specific row in Google Sheets via SheetDB
      const response = await fetch(`${SHEETDB_URL}/id/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          data: {
            status: 'DONE',
            image_link: imageLink
          }
        })
      });

      if (response.ok) {
        alert('Job completed!');
        loadComplaints();
      }
    }

    loadComplaints();
  </script>
</body>
</html>
