      const bars = [];
      let xKey = "day";
      let yKey = "name";
      React.Children.forEach(children, (ch) => {
        if (!ch) return;
        if (ch.type === Bar) bars.push(ch.props);
        if (ch.type === XAxis && ch.props.dataKey) xKey = ch.props.dataKey;
        if (ch.type === YAxis && ch.props.dataKey) yKey = ch.props.dataKey;
      });
      const maxVal = Math.max(1, ...data.flatMap((d) => bars.map((b) => Number(d[b.dataKey] || 0))));

      if (layout === "vertical") {
        return (
          <div className="h-full flex flex-col justify-between gap-2 py-2">
            {data.map((row, i) => (
              <div key={i} className="flex items-center gap-3 text-xs">

                <div className="flex-1 h-5 bg-slate-100 rounded overflow-hidden flex">
                  {bars.map((b) => {
                    const w = Math.round((Number(row[b.dataKey] || 0) / maxVal) * 100);
                    return <div key={b.dataKey} style={{ width: `${w}%`, backgroundColor: b.fill }} />;
                  })}
                </div>
              </div>
            ))}
            <Legend payload={bars.map((b) => ({ value: b.dataKey, color: b.fill }))} />
          </div>
        );
      }

      return (
        <div className="h-full flex flex-col justify-between">

                    const val = Number(d[b.dataKey] || 0);
                    const pct = Math.round((val / maxVal) * 100);
                    return (
                      <div
                        key={b.dataKey}
                        title={`${b.dataKey}: ${val}`}
                        style={{ height: `${Math.max(val > 0 ? 10 : 3, pct)}%`, backgroundColor: b.fill }}
                        className="w-3 rounded-t transition-all"
                      />
                    );
                  })}
                </div>
                <span className="text-[10px] text-slate-500 truncate max-w-full">{d[xKey]}</span>
              </div>
            ))}
          </div>
          <Legend payload={bars.map((b) => ({ value: b.dataKey, color: b.fill }))} />
        </div>
      );

    const Bar = () => null;

    const LineChart = ({ data = [], children }) => {
      const lines = [];
      React.Children.forEach(children, (ch) => {
        if (ch && ch.type === Line) lines.push(ch.props);
      });
      const maxVal = Math.max(1, ...data.flatMap((d) => lines.map((l) => Number(d[l.dataKey] || 0))));
      const pts = (key) =>
        data
          .map((d, idx) => {
            const x = data.length > 1 ? (idx / (data.length - 1)) * 280 + 10 : 150;
            const y = 90 - (Number(d[key] || 0) / maxVal) * 75;
            return `${x},${y}`;
          })
          .join(" ");

          </svg>
          <Legend payload={lines.map((l) => ({ value: l.dataKey, color: l.stroke }))} />
        </div>
      );

    const PieChart = ({ children }) => {
      let pieProps = null;
      const colors = [];
      React.Children.forEach(children, (ch) => {

        if (ch.type === Pie) {
          pieProps = ch.props;
          React.Children.forEach(ch.props.children, (inner) => {
            if (inner && inner.type === Cell) colors.push(inner.props.fill);
          });
        }
      });
      const data = pieProps?.data || [];
      const nameKey = pieProps?.nameKey || "name";
      const valKey = pieProps?.dataKey || "value";
      const total = Math.max(1, data.reduce((s, item) => s + Number(item[valKey] || 0), 0));
      let offset = 0;
      const r = 32;
      const circ = 2 * Math.PI * r;

      return (
        <div className="h-full flex flex-col items-center justify-center">
          <svg className="w-32 h-32 -rotate-90" viewBox="0 0 90 90">
            {data.map((item, idx) => {
              const frac = Number(item[valKey] || 0) / total;
              const dash = frac * circ;
              const fill = item.color || colors[idx % Math.max(1, colors.length)] || "#0284c7";
              const el = (
                <circle
                  key={idx}
                  cx="45"
                  cy="45"
                  r={r}
                  fill="none"
                  stroke={fill}
                  strokeWidth="12"
                  strokeDasharray={`${dash} ${circ}`}
                  strokeDashoffset={-offset}
                />
              );
              offset += dash;
              return el;
            })}
          </svg>
          <Legend
            payload={data.map((item, idx) => ({
              value: `${item[nameKey]} (${item[valKey]})`,
              color: item.color || colors[idx % Math.max(1, colors.length)] || "#0284c7"

          />
        </div>
      );

  contact_phone text DEFAULT '',
  is_active boolean NOT NULL DEFAULT true,
  created_at timestamptz NOT NULL DEFAULT now(),
  updated_at timestamptz NOT NULL DEFAULT now()
);

);

    function formatKuwaitDateShort(isoString) {
      if (!isoString) return '—';
      try {
        return new Intl.DateTimeFormat('en-GB', {
          timeZone: 'Asia/Kuwait',
          day: '2-digit',
          month: 'short',
          year: 'numeric'
        }).format(new Date(isoString));
      } catch {
        return isoString;
      }
    }

    function formatKuwaitDateTime(isoString) {
      if (!isoString) return '—';
      try {
        return new Intl.DateTimeFormat('en-GB', {
          timeZone: 'Asia/Kuwait',
          year: 'numeric',
          month: 'short',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
          hour12: true
        }).format(new Date(isoString));
      } catch {
        return isoString;

        const cleanUrl = (urlToUse || '').trim();
        const cleanKey = (keyToUse || '').trim();
        if (!cleanUrl || !cleanKey) {
          setSupabaseClient(null);
          setConnectionStatus('disconnected');
          return;
        }
        setConnectionStatus('connecting');
        setConnectionError('');
        try {
          if (!window.supabase) throw new Error('Supabase SDK failed to load.');
          const client = window.supabase.createClient(cleanUrl, cleanKey, {
            auth: { persistSession: true, autoRefreshToken: true }
          });
          const { error } = await client.rpc('get_public_locations');
          if (error && error.message && error.message.includes('Failed to fetch')) {
            throw new Error('Could not reach Supabase URL.');
          }
          localStorage.setItem('ac_sb_url', cleanUrl);
          localStorage.setItem('ac_sb_anon', cleanKey);
          setSupabaseUrl(cleanUrl);
          setSupabaseAnonKey(cleanKey);
          setSupabaseClient(client);
          setConnectionStatus('connected');
          showToast('Connected to live Supabase backend!', 'success');
        } catch (err) {
          setConnectionStatus('error');
          setConnectionError(err.message || 'Connection failed');
          showToast(`Connection failed: ${err.message}`, 'error');
        }
      };

      useEffect(() => {
        if (supabaseUrl && supabaseAnonKey) {
          connectToSupabase(supabaseUrl, supabaseAnonKey);
        }
      }, []);

      const handleLogin = async (e, targetRole) => {
        e.preventDefault();
        setAuthLoading(true);
        try {
          if (targetRole === 'admin') {
            if (
              (loginIdentifier.toLowerCase() === 'admin' || loginIdentifier.toLowerCase() === 'admin@coolfix-kw.com') &&
              loginPassword === 'admin123'
            ) {
              setAuthUser({ id: 'admin-1', full_name: 'Admin Supervisor', username: 'admin', role: 'admin', team_id: null });
              setView('admin_app');
              setLoginPassword('');
              showToast('Welcome Admin — You have full access to the dashboard', 'success');
            } else {
              throw new Error('Demo Admin: username "admin" • password "admin123"');
            }
          } else {
            const team = teams.find((tm) => tm.login_username.toLowerCase() === loginIdentifier.trim().toLowerCase());
            if (!team) throw new Error('Try "team_alpha", "team_bravo", "team_charlie", or "team_delta"');
            if (!team.is_active) throw new Error('This team account is deactivated.');
            if (loginPassword !== 'team123') throw new Error('Demo Team password is "team123"');
            setAuthUser({
              id: `user-${team.id}`,
              full_name: team.team_leader_name,
              username: team.login_username,
              role: 'team',
              team_id: team.id
            });
            setView('team_app');
            setLoginPassword('');
          }
        } catch (err) {
          showToast(err.message || 'Login failed', 'error');
        } finally {
          setAuthLoading(false);
        }
      };

      const handleLogout = () => {
        setAuthUser(null);
        setView('role_select');
        showToast('Logged out', 'info');
      };

      const generateNextTicketNumber = () => {
        const year = new Date().getFullYear();
        const prefix = `AC-${year}-`;
        let maxNum = 0;
        complaints.forEach((c) => {
          if (c.ticket_number && c.ticket_number.startsWith(prefix)) {
            const num = parseInt(c.ticket_number.replace(prefix, ''), 10);
            if (!isNaN(num) && num > maxNum) maxNum = num;
          }
        });
        return `${prefix}${String(maxNum + 1).padStart(4, '0')}`;
      };

      const handleCustomerSubmitComplaint = async (formData) => {
        const loc = locations.find((l) => l.id === formData.location_id);
        if (!loc) return null;
        const ticketNumber = generateNextTicketNumber();
        const nowIso = new Date().toISOString();
        const newId = `cmp-${Date.now()}`;
        setComplaints((prev) => [
          {
            id: newId,
            ticket_number: ticketNumber,
            company_id: loc.company_id,
            location_id: loc.id,
            area_id: loc.area_id,
            contact_person: formData.contact_person,
            contact_phone: formData.contact_phone,
            priority: formData.priority,
            issue_type: formData.issue_type,
            description: formData.description,
            status: 'pending',
            assigned_team_id: null,
            created_at: nowIso,
            updated_at: nowIso,
            assigned_at: null,
            started_at: null,
            completed_at: null,
            completion_notes: ''
          },
          ...prev
        ]);
        setStatusHistory((prev) => [
          ...prev,
          { id: `sh-${Date.now()}`, complaint_id: newId, previous_status: null, new_status: 'pending', notes: 'Submitted via Customer Portal', created_at: nowIso }
        ]);
        showToast(`Complaint registered: ${ticketNumber}`, 'success');
        return ticketNumber;
      };

      const handleAssignTeam = (complaintId, teamId, assignmentNotes, newPriority) => {
        const nowIso = new Date().toISOString();
        const targetTeam = teams.find((tm) => tm.id === teamId);
        const complaint = complaints.find((c) => c.id === complaintId);
        if (!targetTeam || !complaint) return;

        setAssignments((prev) => [
          ...prev.map((a) => (a.complaint_id === complaintId && a.is_current ? { ...a, is_current: false, unassigned_at: nowIso } : a)),
          {
            id: `asg-${Date.now()}`,
            complaint_id: complaintId,
            team_id: teamId,
            assigned_by: authUser?.full_name || 'Admin',
            assignment_notes: assignmentNotes,
            assigned_at: nowIso,
            unassigned_at: null,
            is_current: true
          }
        ]);
        const nextStatus = complaint.status === 'pending' ? 'assigned' : complaint.status;
        setComplaints((prev) =>
          prev.map((c) =>
            c.id === complaintId
              ? { ...c, assigned_team_id: teamId, status: nextStatus, priority: newPriority || c.priority, assigned_at: nowIso }
              : c
          )
        );
        showToast(`Assigned ${complaint.ticket_number} to ${targetTeam.team_name}`, 'success');
      };

      const handleStartProgress = (complaintId) => {
        const nowIso = new Date().toISOString();
        setComplaints((prev) => prev.map((c) => (c.id === complaintId ? { ...c, status: 'in_progress', started_at: nowIso } : c)));
        showToast('Work started!', 'success');
      };

      const handleCompleteWork = (complaintId, completionNotes) => {
        if (!completionNotes?.trim()) {
          showToast('Please enter completion notes first.', 'error');
          return;
        }
        const nowIso = new Date().toISOString();
        setComplaints((prev) =>
          prev.map((c) =>
            c.id === complaintId
              ? { ...c, status: 'completed', completed_at: nowIso, completion_notes: completionNotes.trim() }
              : c
          )
        );
        showToast('Marked as Completed!', 'success');
      };

      const handlePhotoUpload = (complaintId, photoType, file) => {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          setPhotos((prev) => [
            ...prev,
            { id: `ph-${Date.now()}`, complaint_id: complaintId, photo_type: photoType, preview_url: reader.result }
          ]);
          showToast(`Attached ${photoType} photo`, 'success');
        };
        reader.readAsDataURL(file);
      };

      const handleAddInternalNote = (complaintId, noteText) => {
        if (!noteText.trim()) return;
        setNotes((prev) => [
          ...prev,
          { id: `note-${Date.now()}`, complaint_id: complaintId, user_name: authUser?.full_name || 'Staff', note: noteText.trim(), created_at: new Date().toISOString() }
        ]);
        showToast('Internal note added', 'success');
      };

      return (
        <div dir={lang === 'ar' ? 'rtl' : 'ltr'} className="min-h-screen font-sans antialiased">
          {toast && (
            <div className="fixed bottom-5 right-5 z-50 max-w-sm">
              <div
                className={`flex items-center gap-3 px-4 py-3 rounded-xl shadow-xl border text-xs font-semibold ${
                  toast.type === 'error'
                    ? 'bg-rose-950 text-rose-100 border-rose-700'
                    : toast.type === 'success'

                <button onClick={() => setToast(null)}>
                  <X className="w-4 h-4 opacity-70 hover:opacity-100" />
                </button>
              </div>
            </div>
          )}

          {view === 'role_select' && (

              lang={lang}
              onToggleLang={() => setLang(lang === 'en' ? 'ar' : 'en')}

                  <Snowflake className="w-8 h-8 text-white" />

                <h1 className="text-3xl font-bold tracking-tight text-white">{t.brandName}</h1>
                <p className="text-sm text-white/85 mt-1">{t.brandTagline}</p>
                <p className="text-xs text-white/75 mt-5 mb-6">{t.selectRole}</p>

                <div className="w-full space-y-3.5">
                  <button
                    onClick={() => { setLoginIdentifier('admin'); setLoginPassword('admin123'); setView('login_admin'); }}
                    className="w-full p-4 rounded-2xl bg-white/12 hover:bg-white/20 border border-white/20 backdrop-blur-md flex items-center justify-between text-left transition group shadow-sm"
                  >
                    <div className="flex items-center gap-4">
                      <div className="w-11 h-11 rounded-xl bg-white/15 flex items-center justify-center shrink-0">
                        <Shield className="w-5 h-5 text-white" />
                      </div>
                      <div>
                        <div className="font-bold text-sm text-white">{t.roleAdmin}</div>
                        <div className="text-xs text-white/75 mt-0.5">{t.roleAdminDesc}</div>
                      </div>
                    </div>
                    <ChevronRight className="w-4 h-4 text-white/70 group-hover:translate-x-0.5 transition" />
                  </button>

                  <button
                    onClick={() => setView('customer_portal')}
                    className="w-full p-4 rounded-2xl bg-white/12 hover:bg-white/20 border border-white/20 backdrop-blur-md flex items-center justify-between text-left transition group shadow-sm"
                  >
                    <div className="flex items-center gap-4">
                      <div className="w-11 h-11 rounded-xl bg-white/15 flex items-center justify-center shrink-0">
                        <User className="w-5 h-5 text-white" />
                      </div>
                      <div>
                        <div className="font-bold text-sm text-white">{t.roleCustomer}</div>
                        <div className="text-xs text-white/75 mt-0.5">{t.roleCustomerDesc}</div>
                      </div>
                    </div>
                    <ChevronRight className="w-4 h-4 text-white/70 group-hover:translate-x-0.5 transition" />
                  </button>

                  <button
                    onClick={() => { setLoginIdentifier('team_alpha'); setLoginPassword('team123'); setView('login_team'); }}
                    className="w-full p-4 rounded-2xl bg-white/12 hover:bg-white/20 border border-white/20 backdrop-blur-md flex items-center justify-between text-left transition group shadow-sm"
                  >
                    <div className="flex items-center gap-4">
                      <div className="w-11 h-11 rounded-xl bg-white/15 flex items-center justify-center shrink-0">
                        <Users className="w-5 h-5 text-white" />
                      </div>
                      <div>
                        <div className="font-bold text-sm text-white">{t.roleTeam}</div>
                        <div className="text-xs text-white/75 mt-0.5">{t.roleTeamDesc}</div>
                      </div>
                    </div>
                    <ChevronRight className="w-4 h-4 text-white/70 group-hover:translate-x-0.5 transition" />
                  </button>
                </div>
              </div>
            </SnowflakeLandingWrapper>
          )}

          {view === 'login_admin' && (
            <SnowflakeLandingWrapper lang={lang} onToggleLang={() => setLang(lang === 'en' ? 'ar' : 'en')} onOpenSupabaseModal={() => setShowSetupModal(true)} connectionStatus={connectionStatus}>
              <div className="w-full max-w-md bg-white/15 backdrop-blur-md border border-white/25 rounded-2xl p-7 shadow-2xl">
                <button onClick={() => setView('role_select')} className="flex items-center gap-1.5 text-xs text-white/80 hover:text-white mb-5">
                  <ArrowLeft className="w-3.5 h-3.5" />
                  <span>{t.backToRoles}</span>
                </button>
                <h2 className="text-lg font-bold text-white mb-4">{t.roleAdmin} Login</h2>
                <form onSubmit={(e) => handleLogin(e, 'admin')} className="space-y-4 text-xs">
                  <input type="text" required value={loginIdentifier} onChange={(e) => setLoginIdentifier(e.target.value)} placeholder="admin" className="w-full px-3.5 py-2.5 rounded-xl bg-white/95 text-slate-900" />
                  <input type="password" required value={loginPassword} onChange={(e) => setLoginPassword(e.target.value)} placeholder="••••••••" className="w-full px-3.5 py-2.5 rounded-xl bg-white/95 text-slate-900" />
                  <div className="p-3 rounded-xl bg-white/10 text-[11px] text-white/85">Sandbox Demo: <strong>admin</strong> / <strong>admin123</strong></div>
                  <button type="submit" disabled={authLoading} className="w-full py-3 rounded-xl bg-white text-[#1d57c9] font-bold text-sm">Sign In to Admin Panel</button>
                </form>
              </div>
            </SnowflakeLandingWrapper>
          )}

          {view === 'login_team' && (
            <SnowflakeLandingWrapper lang={lang} onToggleLang={() => setLang(lang === 'en' ? 'ar' : 'en')} onOpenSupabaseModal={() => setShowSetupModal(true)} connectionStatus={connectionStatus}>
              <div className="w-full max-w-md bg-white/15 backdrop-blur-md border border-white/25 rounded-2xl p-7 shadow-2xl">
                <button onClick={() => setView('role_select')} className="flex items-center gap-1.5 text-xs text-white/80 hover:text-white mb-5">
                  <ArrowLeft className="w-3.5 h-3.5" />
                  <span>{t.backToRoles}</span>
                </button>
                <h2 className="text-lg font-bold text-white mb-4">{t.roleTeam} Login</h2>
                <form onSubmit={(e) => handleLogin(e, 'team')} className="space-y-4 text-xs">
                  <input type="text" required value={loginIdentifier} onChange={(e) => setLoginIdentifier(e.target.value)} placeholder="team_alpha" className="w-full px-3.5 py-2.5 rounded-xl bg-white/95 text-slate-900 font-mono" />
                  <input type="password" required value={loginPassword} onChange={(e) => setLoginPassword(e.target.value)} placeholder="••••••••" className="w-full px-3.5 py-2.5 rounded-xl bg-white/95 text-slate-900" />
                  <div className="p-3 rounded-xl bg-white/10 text-[11px] text-white/85">Sandbox Demo Teams: <strong>team_alpha</strong>, <strong>team_bravo</strong>, <strong>team_charlie</strong>, <strong>team_delta</strong> • Password: <strong>team123</strong></div>
                  <button type="submit" disabled={authLoading} className="w-full py-3 rounded-xl bg-white text-[#1d57c9] font-bold text-sm">Sign In as Team Leader</button>
                </form>
              </div>
            </SnowflakeLandingWrapper>
          )}

          {view === 'customer_portal' && (
            <CustomerPortalView
              t={t}
              lang={lang}
              onToggleLang={() => setLang(lang === 'en' ? 'ar' : 'en')}
              onBackToRoles={() => setView('role_select')}
              locations={locations}
              complaints={complaints}
              teams={teams}
              onSubmitComplaint={handleCustomerSubmitComplaint}
            />
          )}

          {view === 'admin_app' && authUser && (
            <AdminWorkspace
              t={t}
              lang={lang}
              onToggleLang={() => setLang(lang === 'en' ? 'ar' : 'en')}
              darkMode={darkMode}
              onToggleDarkMode={() => setDarkMode(!darkMode)}
              authUser={authUser}
              onLogout={handleLogout}
              onOpenSupabaseModal={() => setShowSetupModal(true)}
              connectionStatus={connectionStatus}
              complaints={complaints}
              teams={teams}
              setTeams={setTeams}
              teamMembers={teamMembers}
              setTeamMembers={setTeamMembers}
              locations={locations}
              setLocations={setLocations}
              areas={areas}
              companies={companies}
              assignments={assignments}
              notes={notes}
              systemSettings={systemSettings}
              onAssignTeam={handleAssignTeam}
              onAddNote={handleAddInternalNote}
              onCreateComplaint={handleCustomerSubmitComplaint}
              showToast={showToast}
            />
          )}

          {view === 'team_app' && authUser && (
            <TeamLeaderWorkspace
              t={t}
              lang={lang}
              onToggleLang={() => setLang(lang === 'en' ? 'ar' : 'en')}
              darkMode={darkMode}
              onToggleDarkMode={() => setDarkMode(!darkMode)}
              team={teams.find((tm) => tm.id === authUser.team_id)}
              complaints={complaints.filter((c) => c.assigned_team_id === authUser.team_id)}
              locations={locations}
              areas={areas}
              companies={companies}
              notes={notes}
              photos={photos}
              onStartProgress={handleStartProgress}
              onCompleteWork={handleCompleteWork}
              onUploadPhoto={handlePhotoUpload}
              onAddNote={handleAddInternalNote}
              onLogout={handleLogout}
            />
          )}

          {showSetupModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/75 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white text-slate-900 rounded-2xl shadow-2xl border border-slate-200 max-w-4xl w-full max-h-[90vh] flex flex-col overflow-hidden">
                <div className="px-6 py-4 bg-slate-900 text-white flex items-center justify-between">
                  <div className="flex items-center gap-2.5">
                    <Database className="w-5 h-5 text-sky-400" />
                    <div>
                      <h2 className="font-bold text-sm">CoolFix Supabase PostgreSQL &amp; Realtime Setup</h2>
                      <p className="text-xs text-slate-400">Connect your Supabase URL &amp; Anon Key or copy the full SQL schema</p>
                    </div>
                  </div>
                  <button onClick={() => setShowSetupModal(false)} className="p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700">
                    <X className="w-4 h-4" />
                  </button>
                </div>
                <div className="flex border-b border-slate-200 bg-slate-50 px-6 pt-3 gap-2">
                  <button onClick={() => setSetupTab('connect')} className={`px-4 py-2 text-xs font-bold rounded-t-lg border-t border-x ${setupTab === 'connect' ? 'bg-white text-sky-600 border-slate-200' : 'text-slate-600 border-transparent'}`}>
                    1. Connect Supabase Project
                  </button>
                  <button onClick={() => setSetupTab('sql')} className={`px-4 py-2 text-xs font-bold rounded-t-lg border-t border-x ${setupTab === 'sql' ? 'bg-white text-sky-600 border-slate-200' : 'text-slate-600 border-transparent'}`}>
                    2. Copy Complete PostgreSQL Schema
                  </button>
                </div>
                <div className="p-6 overflow-y-auto flex-1 space-y-4">
                  {setupTab === 'connect' ? (
                    <>
                      <input type="url" value={supabaseUrl} onChange={(e) => setSupabaseUrl(e.target.value)} placeholder="https://xyzcompany.supabase.co" className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs" />
                      <input type="password" value={supabaseAnonKey} onChange={(e) => setSupabaseAnonKey(e.target.value)} placeholder="Supabase Anon Key" className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs" />
                      {connectionError && <p className="text-xs text-rose-600 font-semibold">{connectionError}</p>}
                      <div className="flex justify-end gap-2">
                        <button onClick={() => connectToSupabase(supabaseUrl, supabaseAnonKey)} className="px-5 py-2 rounded-xl bg-sky-600 text-white text-xs font-bold">Save &amp; Connect</button>
                      </div>
                    </>
                  ) : (
                    <div className="space-y-3">
                      <button
                        onClick={() => { navigator.clipboard.writeText(SUPABASE_SCHEMA_SQL); showToast('SQL Schema copied!', 'success'); }}
                        className="px-3.5 py-1.5 rounded-lg bg-slate-900 text-white text-xs font-bold"
                      >
                        Copy SQL
                      </button>
                      <pre className="bg-slate-950 text-emerald-300 p-4 rounded-xl text-[11px] font-mono overflow-x-auto max-h-80">{SUPABASE_SCHEMA_SQL}</pre>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function AdminWorkspace({
      t, lang, onToggleLang, darkMode, onToggleDarkMode, authUser, onLogout, onOpenSupabaseModal,
      connectionStatus, complaints, teams, setTeams, teamMembers, setTeamMembers, locations, setLocations,
      areas, companies, assignments, notes, systemSettings, onAssignTeam, onAddNote, onCreateComplaint, showToast
    }) {
      const [activeNav, setActiveNav] = useState('dashboard');
      const [inspectComplaintId, setInspectComplaintId] = useState(null);
      const [assignTeamId, setAssignTeamId] = useState('');
      const [assignNotes, setAssignNotes] = useState('');
      const [assignPriority, setAssignPriority] = useState('normal');
      const [adminPrivateNote, setAdminPrivateNote] = useState('');
      const [searchQuery, setSearchQuery] = useState('');
      const [filterStatus, setFilterStatus] = useState('all');

      const inspectComplaint = useMemo(() => complaints.find((c) => c.id === inspectComplaintId) || null, [complaints, inspectComplaintId]);
      const kpis = useMemo(() => ({
        total: complaints.length,
        pending: complaints.filter((c) => c.status === 'pending').length,
        inProgress: complaints.filter((c) => c.status === 'in_progress').length,
        completed: complaints.filter((c) => c.status === 'completed').length
      }), [complaints]);

      const statusDonutData = useMemo(() => [
        { name: 'Pending', value: kpis.pending || 1, color: '#F59E0B' },
        { name: 'Assigned', value: complaints.filter((c) => c.status === 'assigned').length || 1, color: '#0284C7' },
        { name: 'In Progress', value: kpis.inProgress || 1, color: '#8B5CF6' },
        { name: 'Done', value: kpis.completed || 1, color: '#10B981' }
      ], [kpis, complaints]);

      const dailyComplaintsData = useMemo(() => {
        const dayMap = {};
        complaints.forEach((c) => {
          const day = new Date(c.created_at).getDate();
          if (!dayMap[day]) dayMap[day] = { day: String(day), Complaints: 0, Done: 0 };
          dayMap[day].Complaints += 1;
          if (c.status === 'completed') dayMap[day].Done += 1;
        });
        const sorted = Object.values(dayMap).sort((a, b) => Number(a.day) - Number(b.day));
        return sorted.length ? sorted : [{ day: '25', Complaints: 1, Done: 0 }];
      }, [complaints]);

      const filteredComplaintsList = useMemo(() => {
        return complaints.filter((c) => {
          if (filterStatus !== 'all' && c.status !== filterStatus) return false;
          if (!searchQuery.trim()) return true;
          const q = searchQuery.toLowerCase();
          const compName = (companies.find((co) => co.id === c.company_id)?.company_name || '').toLowerCase();
          return c.ticket_number.toLowerCase().includes(q) || compName.includes(q) || c.issue_type.toLowerCase().includes(q);
        });
      }, [complaints, filterStatus, searchQuery, companies]);

      const shellBg = darkMode ? 'bg-slate-950 text-slate-100' : 'bg-[#f8fafc] text-slate-900';
      const sidebarBg = darkMode ? 'bg-slate-900 border-slate-800' : 'bg-[#f4f6f9] border-slate-200/80';
      const cardBg = darkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200/90';

      return (
        <div className={`min-h-screen flex flex-col md:flex-row ${shellBg}`}>
          <aside className={`w-full md:w-60 shrink-0 border-b md:border-b-0 md:border-r flex flex-col justify-between ${sidebarBg}`}>
            <div>
              <div className="p-5 flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-xl bg-[#0088e8] flex items-center justify-center text-white shadow-sm">
                    <Snowflake className="w-5 h-5" />
                  </div>
                  <div>
                    <div className="font-bold text-sm leading-tight">{t.brandName}</div>
                    <div className="text-[11px] text-slate-500">{t.adminPanel}</div>
                  </div>
                </div>
                <button onClick={onOpenSupabaseModal} className={`w-2.5 h-2.5 rounded-full ${connectionStatus === 'connected' ? 'bg-emerald-500' : 'bg-amber-400'}`} />
              </div>
              <nav className="px-3 space-y-1">
                {[
                  { id: 'dashboard', label: t.dashboard, icon: LayoutGrid },
                  { id: 'complaints', label: t.complaints, icon: Wrench },
                  { id: 'teams', label: t.teams, icon: Users },
                  { id: 'locations', label: t.locations, icon: MapPin },
                  { id: 'reports', label: t.reports, icon: BarChart3 }
                ].map((item) => {
                  const IconComp = item.icon;
                  const isActive = activeNav === item.id;
                  return (
                    <button
                      key={item.id}
                      onClick={() => setActiveNav(item.id)}
                      className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold transition ${
                        isActive ? (darkMode ? 'bg-slate-800 text-white' : 'bg-[#e6ebf1] text-slate-900 font-bold') : 'text-slate-600 hover:bg-slate-200/50 dark:text-slate-400'
                      }`}
                    >
                      <IconComp className="w-4 h-4 opacity-80" />
                      <span>{item.label}</span>
                    </button>
                  );
                })}
              </nav>
            </div>
            <div className="p-3 border-t border-slate-200/70 dark:border-slate-800 space-y-1">
              <button onClick={onToggleLang} className="w-full flex items-center gap-3 px-3.5 py-2 rounded-xl text-xs font-medium text-slate-600 dark:text-slate-400">
                <Languages className="w-4 h-4" />
                <span>{lang === 'en' ? 'العربية' : 'English'}</span>
              </button>
              <button onClick={onToggleDarkMode} className="w-full flex items-center gap-3 px-3.5 py-2 rounded-xl text-xs font-medium text-slate-600 dark:text-slate-400">
                {darkMode ? <Sun className="w-4 h-4" /> : <Moon className="w-4 h-4" />}
                <span>{darkMode ? t.lightMode : t.darkMode}</span>
              </button>
              <button onClick={onLogout} className="w-full flex items-center gap-3 px-3.5 py-2 rounded-xl text-xs font-medium text-slate-600 hover:text-rose-600 dark:text-slate-400">
                <LogOut className="w-4 h-4" />
                <span>{t.logout}</span>
              </button>
            </div>
          </aside>

          <main className="flex-1 p-5 sm:p-8 overflow-y-auto">
            <div className="max-w-6xl mx-auto space-y-6">
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <div className={`p-5 rounded-2xl border-2 border-sky-200/90 shadow-xs ${cardBg}`}>
                  <div className="w-9 h-9 rounded-xl bg-sky-50 text-sky-600 flex items-center justify-center mb-4"><Wrench className="w-4 h-4" /></div>
                  <div className="text-2xl font-extrabold">{kpis.total}</div>
                  <div className="text-xs text-slate-500 mt-1">{t.totalComplaints}</div>
                </div>
                <div className={`p-5 rounded-2xl border shadow-xs ${cardBg}`}>
                  <div className="w-9 h-9 rounded-xl bg-amber-50 text-amber-500 flex items-center justify-center mb-4"><Clock className="w-4 h-4" /></div>
                  <div className="text-2xl font-extrabold">{kpis.pending}</div>
                  <div className="text-xs text-slate-500 mt-1">{t.pending}</div>
                </div>
                <div className={`p-5 rounded-2xl border shadow-xs ${cardBg}`}>
                  <div className="w-9 h-9 rounded-xl bg-purple-50 text-purple-500 flex items-center justify-center mb-4"><AlertCircle className="w-4 h-4" /></div>
                  <div className="text-2xl font-extrabold">{kpis.inProgress}</div>
                  <div className="text-xs text-slate-500 mt-1">{t.inProgress}</div>
                </div>
                <div className={`p-5 rounded-2xl border shadow-xs ${cardBg}`}>
                  <div className="w-9 h-9 rounded-xl bg-emerald-50 text-emerald-500 flex items-center justify-center mb-4"><CheckCircle2 className="w-4 h-4" /></div>
                  <div className="text-2xl font-extrabold">{kpis.completed}</div>
                  <div className="text-xs text-slate-500 mt-1">{t.completed}</div>
                </div>
              </div>

              {activeNav === 'dashboard' && (
                <div className="grid grid-cols-1 lg:grid-cols-12 gap-5">
                  <div className={`lg:col-span-8 p-6 rounded-2xl border shadow-xs ${cardBg}`}>
                    <h3 className="text-sm font-bold mb-4">{t.dailyComplaints}</h3>
                    <div className="h-60">
                      <ResponsiveContainer>
                        <BarChart data={dailyComplaintsData}>
                          <XAxis dataKey="day" />
                          <YAxis />
                          <Bar dataKey="Complaints" fill="#2da4dc" />
                          <Bar dataKey="Done" fill="#2ab673" />
                        </BarChart>
                      </ResponsiveContainer>
                    </div>
                  </div>
                  <div className={`lg:col-span-4 p-6 rounded-2xl border shadow-xs ${cardBg}`}>
                    <h3 className="text-sm font-bold mb-4">{t.statusTitle}</h3>
                    <div className="h-60">
                      <ResponsiveContainer>
                        <PieChart>
                          <Pie data={statusDonutData} dataKey="value" nameKey="name" />
                        </PieChart>
                      </ResponsiveContainer>
                    </div>
                  </div>
                </div>
              )}

              {activeNav === 'complaints' && (
                <div className="space-y-4">
                  <div className="flex flex-wrap items-center justify-between gap-3">
                    <input value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} placeholder="Search by ticket, company, issue..." className={`px-4 py-2 rounded-xl border border-slate-200 text-xs flex-1 min-w-[220px] ${cardBg}`} />
                    <div className="flex gap-1.5">
                      {['all', 'pending', 'assigned', 'in_progress', 'completed'].map((st) => (
                        <button key={st} onClick={() => setFilterStatus(st)} className={`px-3 py-2 rounded-xl text-xs font-semibold capitalize ${filterStatus === st ? 'bg-[#0088e8] text-white' : 'bg-[#eef2f6] text-slate-600'}`}>
                          {st === 'all' ? 'All' : st === 'completed' ? 'Done' : st.replace('_', ' ')}
                        </button>
                      ))}
                    </div>
                  </div>
                  <div className={`rounded-2xl border shadow-xs overflow-x-auto ${cardBg}`}>
                    <table className="w-full text-left text-xs">
                      <thead>
                        <tr className="border-b border-slate-200 text-[11px] text-slate-500">
                          <th className="py-3 px-4">Ticket</th>
                          <th className="py-3 px-4">Company</th>
                          <th className="py-3 px-4">Issue</th>
                          <th className="py-3 px-4">Area</th>
                          <th className="py-3 px-4">Team</th>
                          <th className="py-3 px-4">Priority</th>
                          <th className="py-3 px-4">Status</th>
                          <th className="py-3 px-4">Date</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {filteredComplaintsList.map((c) => (
                          <tr key={c.id} onClick={() => { setInspectComplaintId(c.id); setAssignTeamId(c.assigned_team_id || teams[0]?.id || ''); setAssignPriority(c.priority); }} className="hover:bg-slate-50 cursor-pointer">
                            <td className="py-3 px-4 font-mono">{c.ticket_number}</td>
                            <td className="py-3 px-4 font-bold">{companies.find((co) => co.id === c.company_id)?.company_name || '—'}</td>
                            <td className="py-3 px-4">{c.issue_type}</td>
                            <td className="py-3 px-4 text-slate-500">{areas.find((a) => a.id === c.area_id)?.area_name || '—'}</td>
                            <td className="py-3 px-4">{teams.find((tm) => tm.id === c.assigned_team_id)?.team_name || '—'}</td>
                            <td className="py-3 px-4"><span className={`px-2.5 py-0.5 rounded text-[10px] font-bold ${PRIORITY_META[c.priority]?.badge}`}>{PRIORITY_META[c.priority]?.label}</span></td>
                            <td className="py-3 px-4"><span className={`px-3 py-1 rounded-full text-[11px] font-bold border ${STATUS_META[c.status]?.badge}`}>{STATUS_META[c.status]?.label}</span></td>
                            <td className="py-3 px-4 text-slate-500">{formatKuwaitDateShort(c.created_at)}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {activeNav === 'teams' && (
                <div className="space-y-4">
                  {teams.map((tm) => (
                    <div key={tm.id} className={`p-5 rounded-2xl border shadow-xs ${cardBg}`}>
                      <div className="font-bold text-sm">{tm.team_name}</div>
                      <div className="text-xs text-slate-500">{tm.team_leader_name} • {tm.team_leader_phone}</div>
                    </div>
                  ))}
                </div>
              )}

              {activeNav === 'locations' && (
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {locations.map((loc) => (
                    <div key={loc.id} className={`p-5 rounded-2xl border shadow-xs ${cardBg}`}>
                      <div className="font-bold text-xs">{loc.branch_name}</div>
                      <div className="text-[11px] text-slate-500 mt-1">{loc.full_address}</div>
                    </div>
                  ))}
                </div>
              )}

              {activeNav === 'reports' && (
                <div className={`p-6 rounded-2xl border shadow-xs space-y-4 ${cardBg}`}>
                  <div className="flex items-center justify-between">
                    <h3 className="text-sm font-bold">Monthly Report</h3>
                    <button
                      onClick={() => {
                        if (!window.XLSX) return;
                        const wb = window.XLSX.utils.book_new();
                        const ws = window.XLSX.utils.json_to_sheet(complaints);
                        window.XLSX.utils.book_append_sheet(wb, ws, 'Complaints');
                        window.XLSX.writeFile(wb, 'CoolFix_Report.xlsx');
                        showToast('Exported CoolFix_Report.xlsx', 'success');
                      }}
                      className="px-4 py-2 rounded-xl border border-slate-200 text-xs font-bold flex items-center gap-1.5"
                    >
                      <Download className="w-3.5 h-3.5" />
                      <span>Export</span>
                    </button>
                  </div>
                  <div className="text-xs text-slate-500">Total records: {complaints.length}</div>
                </div>
              )}

              {inspectComplaint && (
                <div className="fixed inset-0 z-50 bg-slate-950/70 flex items-center justify-center p-4">
                  <div className="bg-white text-slate-900 rounded-2xl max-w-lg w-full p-6 space-y-4 text-xs">
                    <div className="flex items-center justify-between">
                      <span className="font-mono font-bold text-sm">{inspectComplaint.ticket_number}</span>
                      <button onClick={() => setInspectComplaintId(null)}><X className="w-4 h-4" /></button>
                    </div>
                    <select value={assignTeamId} onChange={(e) => setAssignTeamId(e.target.value)} className="w-full px-3 py-2 rounded-xl border border-slate-300 bg-white">
                      {teams.map((tm) => <option key={tm.id} value={tm.id}>{tm.team_name}</option>)}
                    </select>
                    <input value={assignNotes} onChange={(e) => setAssignNotes(e.target.value)} placeholder="Assignment notes..." className="w-full px-3 py-2 rounded-xl border border-slate-300" />
                    <button onClick={() => { onAssignTeam(inspectComplaint.id, assignTeamId, assignNotes, assignPriority); setInspectComplaintId(null); }} className="w-full py-2.5 rounded-xl bg-sky-600 text-white font-bold">
                      Confirm Assignment
                    </button>
                  </div>
                </div>
              )}
            </div>
          </main>
        </div>
      );
    }

    function CustomerPortalView({ t, lang, onToggleLang, onBackToRoles, locations, complaints, teams, onSubmitComplaint }) {
      const [locationId, setLocationId] = useState(locations[0]?.id || '');
      const [contactPerson, setContactPerson] = useState('');
      const [contactPhone, setContactPhone] = useState('');
      const [issueType, setIssueType] = useState(ISSUE_TYPES[0]);
      const [priority, setPriority] = useState('normal');
      const [description, setDescription] = useState('');
      const [generatedTicket, setGeneratedTicket] = useState(null);

      return (
        <div className="min-h-screen bg-[#f8fafc] text-slate-900">
          <header className="bg-gradient-to-r from-[#1b93df] to-[#1d64d8] text-white px-6 py-4">
            <div className="max-w-4xl mx-auto flex items-center justify-between">
              <div className="flex items-center gap-3">
                <button onClick={onBackToRoles} className="p-2 rounded-xl bg-white/15"><ArrowLeft className="w-4 h-4" /></button>
                <div className="font-bold text-sm">{t.brandName} — {t.roleCustomer}</div>
              </div>
              <button onClick={onToggleLang} className="px-3 py-1.5 rounded-lg bg-white/15 text-xs font-semibold">{lang === 'en' ? 'العربية' : 'English'}</button>
            </div>
          </header>
          <main className="max-w-2xl mx-auto p-6 space-y-4">
            {generatedTicket && (
              <div className="p-4 rounded-xl bg-emerald-50 border border-emerald-200 text-xs font-bold text-emerald-900">
                Ticket Generated: <span className="font-mono">{generatedTicket}</span>
              </div>
            )}
            <form
              onSubmit={async (e) => {
                e.preventDefault();
                const ticket = await onSubmitComplaint({ location_id: locationId, contact_person: contactPerson, contact_phone: contactPhone, issue_type: issueType, priority, description });
                if (ticket) { setGeneratedTicket(ticket); setContactPerson(''); setContactPhone(''); setDescription(''); }
              }}
              className="bg-white p-6 rounded-2xl border border-slate-200 space-y-3 text-xs"
            >
              <select required value={locationId} onChange={(e) => setLocationId(e.target.value)} className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 bg-white">
                {locations.map((l) => <option key={l.id} value={l.id}>{l.branch_name}</option>)}
              </select>
              <input required value={contactPerson} onChange={(e) => setContactPerson(e.target.value)} placeholder="Contact Name" className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300" />
              <input required value={contactPhone} onChange={(e) => setContactPhone(e.target.value)} placeholder="Phone (+965...)" className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300" />
              <select value={issueType} onChange={(e) => setIssueType(e.target.value)} className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 bg-white">
                {ISSUE_TYPES.map((it) => <option key={it} value={it}>{it}</option>)}
              </select>
              <textarea required rows={3} value={description} onChange={(e) => setDescription(e.target.value)} placeholder="Describe the AC issue..." className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300" />
              <button type="submit" className="w-full py-3 rounded-xl bg-[#1b93df] text-white font-bold text-sm">Submit AC Complaint</button>
            </form>
          </main>
        </div>
      );
    }

    function TeamLeaderWorkspace({ t, lang, onToggleLang, darkMode, onToggleDarkMode, team, complaints, onStartProgress, onCompleteWork, onLogout }) {
      const [completionNotes, setCompletionNotes] = useState('');
      return (
        <div className={`min-h-screen p-6 ${darkMode ? 'bg-slate-950 text-slate-100' : 'bg-[#f8fafc] text-slate-900'}`}>
          <div className="max-w-4xl mx-auto space-y-5">
            <div className="flex items-center justify-between">
              <div>
                <h1 className="text-xl font-extrabold">My Tasks — {team?.team_name || 'Team'}</h1>
                <p className="text-xs text-slate-500">{team?.team_leader_name}</p>
              </div>
              <div className="flex gap-2">
                <button onClick={onToggleLang} className="px-3 py-1.5 rounded-xl border text-xs font-semibold">{lang === 'en' ? 'العربية' : 'English'}</button>
                <button onClick={onToggleDarkMode} className="px-3 py-1.5 rounded-xl border text-xs font-semibold">{darkMode ? 'Light' : 'Dark'}</button>
                <button onClick={onLogout} className="px-3 py-1.5 rounded-xl bg-slate-900 text-white text-xs font-bold">Logout</button>
              </div>
            </div>
            <div className="space-y-3">
              {complaints.map((job) => (
                <div key={job.id} className={`p-4 rounded-2xl border space-y-3 text-xs ${darkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'}`}>
                  <div className="flex items-center justify-between">
                    <span className="font-mono font-bold text-sky-600">{job.ticket_number}</span>
                    <span className={`px-3 py-1 rounded-full font-bold border ${STATUS_META[job.status]?.badge}`}>{STATUS_META[job.status]?.label}</span>
                  </div>
                  <div className="font-bold text-sm">{job.issue_type}</div>
                  <div className="text-slate-500">{job.description}</div>
                  {job.status !== 'completed' && (
                    <div className="flex flex-wrap gap-2 pt-2">
                      {job.status !== 'in_progress' && (
                        <button onClick={() => onStartProgress(job.id)} className="px-3.5 py-2 rounded-xl bg-[#0088e8] text-white font-bold">Start Work</button>
                      )}
                      <input value={completionNotes} onChange={(e) => setCompletionNotes(e.target.value)} placeholder="Completion notes..." className="px-3 py-2 rounded-xl border border-slate-300 flex-1 min-w-[180px] text-slate-900" />
                      <button onClick={() => onCompleteWork(job.id, completionNotes || 'Completed on site')} className="px-3.5 py-2 rounded-xl bg-emerald-600 text-white font-bold">Mark as Completed</button>
                    </div>
                  )}
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
