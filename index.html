<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Room Expenses (KWD)</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f4f7f6; }
    .card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    input, select, button { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; }
    button { background-color: #007bff; color: white; border: none; border-radius: 4px; font-weight: bold; }
    .hidden { display: none; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background-color: #f2f2f2; }
  </style>
</head>
<body>

  <!-- LOGIN SECTION -->
  <div id="loginSection" class="card">
    <h2>Room Expense Login</h2>
    <select id="userSelect">
      <option value="">Select Your Name</option>
      <option value="Amir Khan">Amir Khan</option>
      <option value="Parvej">Parvej</option>
      <option value="Meraj">Meraj</option>
      <option value="Modassir">Modassir</option>
      <option value="Rizwan">Rizwan</option>
    </select>
    <input type="password" id="passwordInput" placeholder="Enter Password">
    <button onclick="login()">Login</button>
  </div>

  <!-- MAIN APP SECTION -->
  <div id="appSection" class="card hidden">
    <h3>Welcome, <span id="currentUser"></span></h3>
    <button onclick="logout()" style="background: #dc3545;">Logout</button>
    <hr>

    <h3>Add Expense</h3>
    <input type="text" id="itemInput" placeholder="Item Name (e.g. Rice, Internet)">
    <input type="number" step="0.001" id="amountInput" placeholder="Amount in KWD">
    <input type="date" id="dateInput">
    <button onclick="addExpense()">Submit Expense</button>

    <hr>
    <h3>Month-End Summary</h3>
    <label for="monthFilter">Select Month:</label>
    <input type="month" id="monthFilter" onchange="loadMonthlyExpenses()">

    <div id="summaryResults"></div>

    <h4>Expense Logs</h4>
    <table id="expenseTable">
      <thead>
        <tr>
          <th>Date</th>
          <th>Paid By</th>
          <th>Item</th>
          <th>Amount (KWD)</th>
        </tr>
      </thead>
      <tbody id="expenseTableBody"></tbody>
    </table>
  </div>

  <script src="app.js"></script>
</body>
</html>
