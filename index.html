<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AC Maintenance - Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <div class="logo">CoolCare Maintenance</div>
    <div class="badge">Dispatch Center</div>
  </header>

  <main class="container">
    <section class="card">
      <h2>Log an AC Complaint</h2>
      <p class="subtitle">Submit issue details to dispatch a technician directly to your location.</p>

      <form id="complaintForm">
        <div class="form-group">
          <label for="location">Select Location / Site Code (300 Locations)</label>
          <select id="location" required>
            <option value="">-- Choose Location --</option>
            <option value="LOC-001">LOC-001 | HQ Main Building</option>
            <option value="LOC-002">LOC-002 | West Wing Branch</option>
            <option value="LOC-003">LOC-003 | Warehouse B</option>
            <!-- Add remaining location codes here -->
          </select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="reportedBy">Your Name</label>
            <input type="text" id="reportedBy" placeholder="John Doe" required>
          </div>
          <div class="form-group">
            <label for="contact">Phone Number</label>
            <input type="tel" id="contact" placeholder="+1234567890" required>
          </div>
        </div>

        <div class="form-group">
          <label for="issueType">Issue Category</label>
          <select id="issueType" required>
            <option value="">-- Select Issue --</option>
            <option value="no-cooling">AC Not Cooling</option>
            <option value="water-leak">Water Leakage</option>
            <option value="strange-noise">Loud Noise / Vibration</option>
            <option value="power-off">Unit Won't Turn On</option>
            <option value="other">Other Maintenance</option>
          </select>
        </div>

        <div class="form-group">
          <label for="description">Issue Details</label>
          <textarea id="description" rows="4" placeholder="Describe the problem, unit number, room name, etc." required></textarea>
        </div>

        <button type="submit" class="btn-primary">Submit Ticket</button>
      </form>
      
      <div id="statusMessage" class="status-msg hidden"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html><!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Submit AC Complaint</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6 flex justify-center items-center min-h-screen">

  <div class="bg-white p-6 rounded-lg shadow-md w-full max-w-md">
    <h2 class="text-2xl font-bold mb-4 text-blue-600">AC Maintenance Request</h2>
    
    <form id="complaintForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium">Your Name / Contact</label>
        <input type="text" id="client_name" required class="w-full border p-2 rounded mt-1">
      </div>

      <div>
        <label class="block text-sm font-medium">Location Name / Branch Number</label>
        <input type="text" id="location_name" placeholder="e.g. Branch #42" required class="w-full border p-2 rounded mt-1">
      </div>

      <div>
        <label class="block text-sm font-medium">Issue Description</label>
        <textarea id="issue" required class="w-full border p-2 rounded mt-1"></textarea>
      </div>

      <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 font-semibold">
        Submit Complaint
      </button>
    </form>
  </div>

  <script>
    // REPLACE THIS WITH YOUR ACTUAL SHEETDB API URL
    const SHEETDB_URL = 'https://sheetdb.io/api/v1/YOUR_SHEETDB_ID';

    document.getElementById('complaintForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const newComplaint = {
        data: [{
          id: 'CMP-' + Math.floor(1000 + Math.random() * 9000),
          client_name: document.getElementById('client_name').value,
          location_name: document.getElementById('location_name').value,
          issue: document.getElementById('issue').value,
          status: 'PENDING',
          image_link: ''
        }]
      };

      const response = await fetch(SHEETDB_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(newComplaint)
      });

      if (response.ok) {
        alert('Complaint submitted successfully!');
        e.target.reset();
      } else {
        alert('Failed to submit. Please check your SheetDB URL.');
      }
    });
  </script>
</body>
</html>
