<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fresh Diet - Sticker & Barcode Generator</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- JSBarcode Library -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <!-- html2pdf Library for PDF Download -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen p-6">

  <!-- HEADER -->
  <header class="max-w-6xl mx-auto flex justify-between items-center mb-8 pb-4 border-b border-slate-800">
    <div>
      <h1 class="text-2xl font-bold text-white flex items-center gap-2">
        <i data-lucide="qr-code" class="text-emerald-400"></i> Sticker & Barcode Generator
      </h1>
      <p class="text-sm text-slate-400">Import subscriptions, generate unique box barcodes, and download printable stickers.</p>
    </div>
    <button onclick="downloadStickerPDF()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-5 py-2.5 rounded-xl shadow flex items-center gap-2 transition">
      <i data-lucide="download" class="w-4 h-4"></i> Download Sticker Sheet (PDF)
    </button>
  </header>

  <main class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-6">

    <!-- LEFT COLUMN: SUBSCRIPTION INPUT -->
    <section class="bg-slate-800 border border-slate-700 rounded-2xl p-5 space-y-4 h-fit">
      <h2 class="font-bold text-lg text-slate-100 flex items-center gap-2">
        <i data-lucide="upload-cloud" class="w-5 h-5 text-emerald-400"></i> Subscription Input
      </h2>

      <!-- FILE UPLOAD -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Upload CSV / Json File</label>
        <input type="file" id="file-input" accept=".csv, .json" onchange="handleFileUpload(event)" class="block w-full text-xs text-slate-400 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-slate-700 file:text-emerald-400 hover:file:bg-slate-600 cursor-pointer bg-slate-900 rounded-xl border border-slate-700 p-1">
      </div>

      <div class="relative flex py-1 items-center">
        <div class="flex-grow border-t border-slate-700"></div>
        <span class="flex-shrink mx-3 text-xs text-slate-500 uppercase font-semibold">or Quick Add</span>
        <div class="flex-grow border-t border-slate-700"></div>
      </div>

      <!-- MANUAL ENTRY FORM -->
      <form id="add-form" onsubmit="addCustomerManual(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-300">Customer Name</label>
          <input type="text" id="cust-name" required placeholder="e.g. Fatima Al-Ahmad" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-slate-300">Mobile No</label>
            <input type="text" id="cust-phone" required placeholder="+965 9000 0000" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300">Customer ID</label>
            <input type="text" id="cust-id" required placeholder="SUB-881" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500">
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300">Address</label>
          <input type="text" id="cust-address" required placeholder="Block 2, St 5, House 12, Hawally" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300">Dietary / Delivery Notes</label>
          <textarea id="cust-notes" rows="2" placeholder="Low carb / Leave at main door" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500"></textarea>
        </div>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl text-xs transition">
          + Add to Sticker Sheet
        </button>
      </form>
    </section>

    <!-- RIGHT COLUMN: STICKER SHEET PREVIEW -->
    <section class="lg:col-span-2 space-y-4">
      <div class="flex justify-between items-center bg-slate-800 border border-slate-700 p-4 rounded-2xl">
        <h2 class="font-bold text-slate-200 text-base flex items-center gap-2">
          <i data-lucide="printer" class="w-5 h-5 text-emerald-400"></i> Sticker Sheet Preview
        </h2>
        <span id="sticker-count" class="bg-emerald-950 text-emerald-400 border border-emerald-800 text-xs font-bold px-3 py-1 rounded-full">
          2 Stickers Ready
        </span>
      </div>

      <!-- PRINTABLE AREA (A4 Container) -->
      <div class="bg-slate-950 border border-slate-800 p-4 rounded-2xl overflow-x-auto">
        <div id="printable-sheet" class="bg-white text-slate-900 p-6 rounded-xl grid grid-cols-2 gap-4 min-w-[650px]">
          <!-- Dynamic stickers rendered here -->
        </div>
      </div>
    </section>
  </main>

  <script>
    lucide.createIcons();

    // Default Subscription List Demo Data
    let subscriptions = [
      {
        barcode: "BOX-20260728-1001",
        customerId: "SUB-101",
        name: "Sara Al-Kuwaiti",
        phone: "+965 9988 7766",
        address: "Block 4, Street 12, House 45, Salmiya",
        notes: "Keto Meal / Leave at door and ring bell."
      },
      {
        barcode: "BOX-20260728-1002",
        customerId: "SUB-102",
        name: "Mohammad Abdullah",
        phone: "+965 6655 4433",
        address: "Block 1, Street 80, Bldg 3, Apt 12, Jabriya",
        notes: "No Dairy / Call before arrival."
      }
    ];

    // Render stickers on screen
    function renderStickers() {
      const sheet = document.getElementById('printable-sheet');
      document.getElementById('sticker-count').innerText = `${subscriptions.length} Stickers Ready`;
      sheet.innerHTML = '';

      subscriptions.forEach((sub, index) => {
        const stickerHtml = `
          <div class="border-2 border-dashed border-slate-400 rounded-xl p-3 bg-white space-y-2 relative flex flex-col justify-between shadow-sm">
            <!-- BRAND HEADER -->
            <div class="flex justify-between items-center border-b border-slate-200 pb-1.5">
              <span class="font-black text-xs text-emerald-700 tracking-wider uppercase">FreshDiet Express</span>
              <span class="text-[10px] font-mono bg-slate-100 px-1.5 py-0.5 rounded border border-slate-300 font-bold">ID: ${sub.customerId}</span>
            </div>

            <!-- CUSTOMER DETAILS -->
            <div class="space-y-1">
              <h3 class="font-bold text-sm text-slate-900 leading-tight">${sub.name}</h3>
              <p class="text-[11px] font-semibold text-slate-700">${sub.phone}</p>
              <p class="text-[10px] text-slate-600 leading-tight">${sub.address}</p>
              <div class="bg-amber-50 border border-amber-200 text-amber-900 text-[10px] font-medium p-1.5 rounded mt-1">
                <strong>Notes:</strong> ${sub.notes || 'None'}
              </div>
            </div>

            <!-- AUTOMATIC BARCODE GENERATED HERE -->
            <div class="pt-1 text-center border-t border-slate-200">
              <svg id="barcode-${index}" class="mx-auto w-full max-h-14"></svg>
            </div>
          </div>
        `;
        sheet.innerHTML += stickerHtml;
      });

      // Generate Barcodes using JSBarcode
      subscriptions.forEach((sub, index) => {
        JsBarcode(`#barcode-${index}`, sub.barcode, {
          format: "CODE128",
          height: 35,
          fontSize: 11,
          margin: 2,
          displayValue: true
        });
      });
    }

    // Add new customer manually
    function addCustomerManual(e) {
      e.preventDefault();
      const name = document.getElementById('cust-name').value;
      const phone = document.getElementById('cust-phone').value;
      const custId = document.getElementById('cust-id').value;
      const address = document.getElementById('cust-address').value;
      const notes = document.getElementById('cust-notes').value;

      const newBarcode = `BOX-20260728-${Math.floor(1000 + Math.random() * 9000)}`;

      subscriptions.push({
        barcode: newBarcode,
        customerId: custId,
        name,
        phone,
        address,
        notes
      });

      renderStickers();
      document.getElementById('add-form').reset();
    }

    // Handle CSV / JSON File Import
    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const content = e.target.result;
        // Basic JSON or CSV parser placeholder logic
        if (file.name.endsWith('.json')) {
          const data = JSON.parse(content);
          subscriptions = data.map((item, i) => ({
            barcode: `BOX-20260728-${1000 + i}`,
            customerId: item.customerId || `SUB-${i+1}`,
            name: item.name,
            phone: item.phone,
            address: item.address,
            notes: item.notes
          }));
          renderStickers();
        }
      };
      reader.readAsText(file);
    }

    // Download PDF Sheet for Printing
    function downloadStickerPDF() {
      const element = document.getElementById('printable-sheet');
      const opt = {
        margin:       0.3,
        filename:     `FreshDiet_Stickers_${new Date().toISOString().split('T')[0]}.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2 },
        jsPDF:        { unit: 'in', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(element).save();
    }

    // Initial render
    renderStickers();
  </script>
</body>
</html>
