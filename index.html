    // Simple SVG charts for standalone HTML without external chart bundle issues
    const SimpleBarChart = ({ data, bars }) => {
      const maxVal = Math.max(
        1,
        ...data.flatMap((d) => bars.map((b) => Number(d[b.key] || 0)))
      );
      return (
        <div className="h-56 flex items-end gap-3 pt-6 pb-2 px-2 overflow-x-auto">
          {data.map((d, i) => (
            <div key={i} className="flex-1 min-w-[36px] flex flex-col items-center gap-1.5">
              <div className="w-full h-40 flex items-end justify-center gap-1">
                {bars.map((b) => {
                  const val = Number(d[b.key] || 0);
                  const pct = Math.round((val / maxVal) * 100);
                  return (
                    <div
                      key={b.key}
                      title={`${b.key}: ${val}`}
                      style={{ height: `${Math.max(val > 0 ? 8 : 2, pct)}%`, backgroundColor: b.color }}

                    />
                  );
                })}
              </div>
              <span className="text-[10px] text-slate-500 truncate max-w-full">{d.label}</span>
            </div>
          ))}
        </div>
      );
    };

    const SimpleDonut = ({ segments }) => {
      const total = Math.max(1, segments.reduce((acc, s) => acc + Number(s.value || 0), 0));
      let offset = 0;
      const r = 34;
      const c = 2 * Math.PI * r;
      return (
        <div className="flex flex-col items-center justify-center">
          <svg className="w-36 h-36 -rotate-90" viewBox="0 0 90 90">
            {segments.map((seg, i) => {
              const frac = Number(seg.value || 0) / total;
              const dash = frac * c;
              const el = (
                <circle
                  key={i}
                  cx="45"
                  cy="45"
                  r={r}
                  fill="none"
                  stroke={seg.color}
                  strokeWidth="12"
                  strokeDasharray={`${dash} ${c}`}
                  strokeDashoffset={-offset}
                />
              );
              offset += dash;
              return el;
            })}
          </svg>
          <div className="flex flex-wrap justify-center gap-3 mt-2 text-[11px] text-slate-600">
            {segments.map((s) => (
              <span key={s.name} className="inline-flex items-center gap-1.5">
                <span className="w-2.5 h-2.5 rounded-xs" style={{ backgroundColor: s.color }} />
                {s.name} ({s.value})
              </span>
            ))}
          </div>
        </div>
      );

              <div className="flex items-center justify-between">
                <button onClick={() => setView('role_select')} className="text-xs font-bold text-sky-600">← Role Selection</button>
                <h1 className="text-lg font-extrabold">Customer Complaint Portal</h1>
              </div>
              {lastTicket && (
                <div className="p-3.5 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-900 text-xs font-semibold">
                  Ticket created: <span className="font-mono">{lastTicket}</span>
                </div>
              )}
              <form onSubmit={submitComplaint} className="bg-white p-6 rounded-2xl border border-slate-200 space-y-3 text-xs">
                <select value={cLoc} onChange={(e) => setCLoc(e.target.value)} className="w-full px-3 py-2.5 rounded-xl border border-slate-300 bg-white">
                  {locations.map((l) => <option key={l.id} value={l.id}>{l.branch_name}</option>)}
                </select>
                <input required value={cPerson} onChange={(e) => setCPerson(e.target.value)} placeholder="Contact Name" className="w-full px-3 py-2.5 rounded-xl border border-slate-300" />
                <input required value={cPhone} onChange={(e) => setCPhone(e.target.value)} placeholder="Phone (+965...)" className="w-full px-3 py-2.5 rounded-xl border border-slate-300" />
                <select value={cIssue} onChange={(e) => setCIssue(e.target.value)} className="w-full px-3 py-2.5 rounded-xl border border-slate-300 bg-white">
                  {ISSUE_TYPES.map((it) => <option key={it} value={it}>{it}</option>)}
                </select>
                <textarea required rows={3} value={cDesc} onChange={(e) => setCDesc(e.target.value)} placeholder="Describe the AC issue..." className="w-full px-3 py-2.5 rounded-xl border border-slate-300" />
                <button type="submit" className="w-full py-2.5 rounded-xl bg-[#0088e8] text-white font-bold text-sm">Submit Complaint</button>
              </form>
            </div>
          )}

          {view === 'admin_app' && authUser && (
            <div className="min-h-screen flex flex-col md:flex-row">
              <aside className="w-full md:w-56 border-b md:border-b-0 md:border-r border-slate-200 bg-[#f4f6f9] p-4 flex flex-col justify-between">
                <div className="space-y-1">
                  <div className="font-bold text-sm px-3 py-2">CoolFix Admin</div>
                  {['dashboard', 'complaints', 'teams', 'locations'].map((tab) => (
                    <button key={tab} onClick={() => setActiveNav(tab)} className={`w-full text-left px-3 py-2 rounded-xl text-xs font-semibold capitalize ${activeNav === tab ? 'bg-[#e6ebf1] font-bold' : 'text-slate-600'}`}>
                      {tab}
                    </button>
                  ))}
                </div>
                <div className="space-y-1 pt-4">
                  <button onClick={() => setDarkMode(!darkMode)} className="w-full text-left px-3 py-2 rounded-xl text-xs text-slate-600">{darkMode ? 'Light Mode' : 'Dark Mode'}</button>
                  <button onClick={() => { setAuthUser(null); setView('role_select'); }} className="w-full text-left px-3 py-2 rounded-xl text-xs text-rose-600 font-semibold">Logout</button>
                </div>
              </aside>
              <main className="flex-1 p-6 space-y-6">
                <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                  <div className="p-4 rounded-2xl bg-white border border-slate-200"><div className="text-2xl font-extrabold">{counts.total}</div><div className="text-xs text-slate-500">Total Complaints</div></div>
                  <div className="p-4 rounded-2xl bg-white border border-slate-200"><div className="text-2xl font-extrabold">{counts.pending}</div><div className="text-xs text-slate-500">Pending</div></div>
                  <div className="p-4 rounded-2xl bg-white border border-slate-200"><div className="text-2xl font-extrabold">{counts.inProgress}</div><div className="text-xs text-slate-500">In Progress</div></div>
                  <div className="p-4 rounded-2xl bg-white border border-slate-200"><div className="text-2xl font-extrabold">{counts.completed}</div><div className="text-xs text-slate-500">Completed</div></div>
                </div>

                {activeNav === 'dashboard' && (
                  <div className="grid grid-cols-1 lg:grid-cols-12 gap-5">
                    <div className="lg:col-span-8 p-5 rounded-2xl bg-white border border-slate-200">
                      <h3 className="text-sm font-bold mb-2">Daily Complaints</h3>
                      <SimpleBarChart
                        data={complaints.slice(0, 6).map((c) => ({ label: c.ticket_number.slice(-4), Complaints: 1, Done: c.status === 'completed' ? 1 : 0 }))}
                        bars={[{ key: 'Complaints', color: '#2da4dc' }, { key: 'Done', color: '#2ab673' }]}
                      />
                    </div>
                    <div className="lg:col-span-4 p-5 rounded-2xl bg-white border border-slate-200">
                      <h3 className="text-sm font-bold mb-2">Status Breakdown</h3>
                      <SimpleDonut
                        segments={[
                          { name: 'Pending', value: counts.pending, color: '#F59E0B' },
                          { name: 'Active', value: counts.inProgress, color: '#8B5CF6' },
                          { name: 'Done', value: counts.completed, color: '#10B981' }
                        ]}
                      />
                    </div>
                  </div>
                )}

                {activeNav === 'complaints' && (
                  <div className="space-y-4">
                    <div className="flex flex-wrap gap-2">
                      <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Search ticket, company, issue..." className="px-3.5 py-2 rounded-xl border border-slate-200 bg-white text-xs flex-1 min-w-[200px]" />
                      {['all', 'pending', 'assigned', 'in_progress', 'completed'].map((st) => (
                        <button key={st} onClick={() => setStatusFilter(st)} className={`px-3 py-2 rounded-xl text-xs font-semibold capitalize ${statusFilter === st ? 'bg-[#0088e8] text-white' : 'bg-slate-200/70 text-slate-700'}`}>
                          {st.replace('_', ' ')}
                        </button>
                      ))}
                    </div>
                    <div className="bg-white rounded-2xl border border-slate-200 overflow-x-auto">
                      <table className="w-full text-left text-xs">
                        <thead>
                          <tr className="border-b border-slate-200 text-slate-500">
                            <th className="py-3 px-4">Ticket</th>
                            <th className="py-3 px-4">Company</th>
                            <th className="py-3 px-4">Issue</th>
                            <th className="py-3 px-4">Status</th>
                            <th className="py-3 px-4">Date</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100">
                          {filtered.map((c) => (
                            <tr key={c.id}>
                              <td className="py-3 px-4 font-mono">{c.ticket_number}</td>
                              <td className="py-3 px-4 font-bold">{companies.find((co) => co.id === c.company_id)?.company_name || '—'}</td>
                              <td className="py-3 px-4">{c.issue_type}</td>
                              <td className="py-3 px-4"><span className={`px-2.5 py-1 rounded-full text-[11px] font-bold border ${STATUS_META[c.status]?.badge}`}>{STATUS_META[c.status]?.label}</span></td>
                              <td className="py-3 px-4 text-slate-500">{formatDateShort(c.created_at)}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}

                {activeNav === 'teams' && (
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {teams.map((tm) => (
                      <div key={tm.id} className="p-4 rounded-2xl bg-white border border-slate-200">
                        <div className="font-bold text-sm">{tm.team_name}</div>
                        <div className="text-xs text-slate-500">{tm.team_leader_name} • {tm.team_leader_phone}</div>
                      </div>
                    ))}
                  </div>
                )}

                {activeNav === 'locations' && (
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    {locations.map((loc) => (
                      <div key={loc.id} className="p-4 rounded-2xl bg-white border border-slate-200">
                        <div className="font-bold text-xs">{loc.branch_name}</div>
                        <div className="text-[11px] text-slate-500 mt-1">{loc.full_address}</div>
                      </div>
                    ))}
                  </div>
                )}
              </main>
            </div>
          )}

          {view === 'team_app' && authUser && (
            <div className="max-w-4xl mx-auto p-6 space-y-5">
              <div className="flex items-center justify-between">
                <div>
                  <h1 className="text-xl font-extrabold">{authUser.team?.team_name || 'Team Tasks'}</h1>
                  <p className="text-xs text-slate-500">{authUser.name}</p>
                </div>
                <button onClick={() => { setAuthUser(null); setView('role_select'); }} className="px-3.5 py-2 rounded-xl bg-slate-200 text-xs font-bold">Logout</button>
              </div>
              <div className="space-y-3">
                {complaints.filter((c) => c.assigned_team_id === (authUser.team?.id || 'team-alpha')).map((job) => (
                  <div key={job.id} className="p-4 rounded-2xl bg-white border border-slate-200 flex flex-wrap items-center justify-between gap-3">
                    <div>
                      <div className="font-mono text-xs font-bold text-sky-600">{job.ticket_number}</div>
                      <div className="font-bold text-sm">{job.issue_type}</div>
                      <div className="text-xs text-slate-500">{job.description}</div>
                    </div>
                    <div className="flex items-center gap-2">
                      <span className={`px-3 py-1 rounded-full text-xs font-bold border ${STATUS_META[job.status]?.badge}`}>{STATUS_META[job.status]?.label}</span>
                      {job.status !== 'in_progress' && job.status !== 'completed' && (
                        <button onClick={() => updateJobStatus(job.id, 'in_progress')} className="px-3 py-1.5 rounded-xl bg-[#0088e8] text-white text-xs font-bold">Start Work</button>
                      )}
                      {job.status !== 'completed' && (
                        <button onClick={() => updateJobStatus(job.id, 'completed')} className="px-3 py-1.5 rounded-xl bg-emerald-600 text-white text-xs font-bold">Complete</button>
                      )}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
